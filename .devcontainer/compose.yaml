version: "3"
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        WORKDIR: /project
    volumes:
      - ..:/project
    image: slack_emoji_race-image
    container_name: slack_emoji_race-container
    tty: true
    env_file: ../.env # shellスクリプト内でも環境変数として使用するため
